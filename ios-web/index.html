<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8b6f4e" />
    <title>Wed Plan</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf9f7;
        color: #1c1917;
      }
      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: calc(32px + env(safe-area-inset-top)) 20px
          calc(32px + env(safe-area-inset-bottom));
        place-items: center;
        background: #faf9f7;
      }
      main {
        width: min(100%, 420px);
        padding: 24px;
        border: 1px solid #e7e0d8;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 40px rgb(28 25 23 / 8%);
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 14px; color: #78716c; line-height: 1.5; }
      ol { margin: 0; padding-left: 20px; line-height: 1.7; }
      code {
        padding: 2px 5px;
        border-radius: 5px;
        background: #f5f0eb;
        font-size: 13px;
      }
      form { display: grid; gap: 10px; margin-top: 18px; }
      label { font-size: 14px; font-weight: 600; }
      input, button {
        box-sizing: border-box;
        width: 100%;
        min-height: 48px;
        border-radius: 10px;
        font: inherit;
      }
      input {
        border: 1px solid #e7e0d8;
        padding: 0 12px;
        background: transparent;
        color: inherit;
      }
      button {
        border: 0;
        padding: 0 16px;
        background: #8b6f4e;
        color: #faf9f7;
        font-weight: 700;
      }
      #status { min-height: 21px; margin: 0; font-size: 14px; }
      @media (prefers-color-scheme: dark) {
        :root, body { background: #12100e; color: #f5f5f4; }
        main { border-color: #2c2621; background: #181512; }
        p { color: #a8a29e; }
        code { background: #1f1b18; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect Wed Plan</h1>
      <p>This iPhone app uses your existing self-hosted Wed Plan server.</p>
      <form id="connection-form">
        <label for="server-url">Server URL</label>
        <input
          id="server-url"
          name="server-url"
          type="url"
          inputmode="url"
          autocapitalize="none"
          autocomplete="url"
          autocorrect="off"
          placeholder="https://wed-plan.example.com"
          required
        />
        <button type="submit">Connect</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#connection-form");
      const input = document.querySelector("#server-url");
      const status = document.querySelector("#status");

      input.value = window.__WED_PLAN_SERVER_URL__ || "";
      window.wedPlanConfigurationError = (message) => {
        status.textContent = message;
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const url = input.value.trim();
        if (!/^https?:\/\//i.test(url)) {
          status.textContent = "Include http:// or https:// in the server URL.";
          return;
        }

        status.textContent = "Connecting…";
        window.webkit?.messageHandlers?.wedPlanSettings?.postMessage({
          action: "setServerURL",
          url,
        });
      });
    </script>
  </body>
</html>
